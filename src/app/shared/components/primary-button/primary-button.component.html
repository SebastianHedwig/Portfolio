@if (href(); as targetHref) {
  <a
    class="primary-button"
    [class.primary-button--disabled]="disabled() || visuallyDisabled()"
    [href]="disabled() ? null : resolvedHref()"
    [attr.aria-disabled]="disabled() || visuallyDisabled()"
    [attr.tabindex]="disabled() ? -1 : null"
    [attr.target]="isExternalHref(targetHref) ? '_blank' : null"
    [attr.rel]="isExternalHref(targetHref) ? 'noopener noreferrer' : null"
    (click)="handleLinkClick($event)"
  >
    <span class="primary-button__label">{{ label() }}</span>
    <span
      class="primary-button__hover-content"
      [class.primary-button__hover-content--label]="hoverLabel()"
      aria-hidden="true"
    >{{ hoverLabel() }}</span>
  </a>
} @else {
  <button
    class="primary-button"
    [class.primary-button--disabled]="disabled() || visuallyDisabled()"
    [type]="type()"
    [disabled]="disabled()"
    [attr.aria-disabled]="disabled() || visuallyDisabled()"
  >
    <span class="primary-button__label">{{ label() }}</span>
    <span
      class="primary-button__hover-content"
      [class.primary-button__hover-content--label]="hoverLabel()"
      aria-hidden="true"
    >{{ hoverLabel() }}</span>
  </button>
}
